<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="icons/icon.svg">
    <title>TubeList Player</title>
    <script type="module" src="/src/player/player.ts"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">
    <header class="flex items-center gap-2 px-6 py-3 border-b border-zinc-800">
      <img src="icons/icon.svg" width="24" height="24" alt="">
      <span class="font-semibold">TubeList</span>
      <span id="plname" class="ml-auto truncate text-sm text-zinc-400"></span>
    </header>
    <main class="mx-auto grid max-w-[1600px] gap-6 p-6">
      <section>
        <div class="aspect-video w-full overflow-hidden rounded-2xl bg-black shadow-2xl">
          <iframe id="yt" class="size-full" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" title="YouTube video player"></iframe>
        </div>
        <h1 id="title" class="mt-4 text-xl font-semibold leading-tight"></h1>
        <p id="meta" class="mt-1 text-sm text-zinc-400"></p>
        <a id="yt-link" target="_blank" rel="noopener" class="mt-2 inline-block text-xs text-zinc-400 hover:text-zinc-100 focus-visible:outline-2 focus-visible:outline-red-500 focus-visible:outline-offset-2">Open on YouTube ↗</a>
      </section>
    </main>
  </body>
</html>
